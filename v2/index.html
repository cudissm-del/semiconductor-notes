<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>반도체 백과</title><style>/* 반도체 백과 (v2 프리뷰) — 항목 페이지·대문 공용 스타일 */
:root {
  --bg: #f7f7f4; --card: #ffffff; --ink: #1d2126; --sub: #5d6672; --line: #e2e5e9;
  --accent: #2563eb; --accent-soft: #eef3fe; --chip: #eef0f3; --missing: #c2410c;
  --cds-text-primary: #1d2126; --cds-text-secondary: #5d6672; --cds-chart-axis: #9aa4b0;
  --cds-chart-grid: #e2e5e9; --cds-chart-reference-tint: #eceff3;
  --cds-chart-categorical-1: #2f7fc4; --cds-chart-categorical-2: #e08a2e; --cds-chart-categorical-3: #3aa655;
  --cds-chart-categorical-4: #b0529e; --cds-chart-categorical-5: #718096;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131518; --card: #1b1e23; --ink: #e8eaed; --sub: #9aa3ad; --line: #2c3037;
    --accent: #6ea8fe; --accent-soft: #1d2739; --chip: #262a31; --missing: #f09368;
    --cds-text-primary: #e8eaed; --cds-text-secondary: #9aa3ad; --cds-chart-axis: #59626e;
    --cds-chart-grid: #2c3037; --cds-chart-reference-tint: #262a31;
    --cds-chart-categorical-1: #4aa3e0; --cds-chart-categorical-2: #eda93f; --cds-chart-categorical-3: #4cc26e;
    --cds-chart-categorical-4: #cf7bc0; --cds-chart-categorical-5: #93a3b8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height: 1.65; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header.top { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
header.top .in { max-width: 880px; margin: 0 auto; padding: 10px 18px; display: flex; gap: 14px; align-items: baseline; }
header.top .brand { font-weight: 800; color: var(--ink); font-size: 16px; }
header.top .tag { color: var(--sub); font-size: 12.5px; }
main { max-width: 880px; margin: 0 auto; padding: 22px 18px 60px; }
.crumb { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.crumb a { color: var(--sub); }
h1.title { font-size: 30px; margin: 2px 0 0; line-height: 1.25; }
.en { color: var(--sub); font-size: 15px; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--sub); }
.chip.cat { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 26px 20px; margin-top: 14px; }
article h2 { font-size: 20px; margin: 26px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
article h3 { font-size: 16.5px; margin: 20px 0 6px; }
article p { margin: 8px 0; }
article blockquote { margin: 14px 0; padding: 12px 16px; background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; font-size: 16.5px; }
article blockquote p { margin: 0; }
.table-wrap { overflow-x: auto; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--chip); }
.fig { margin: 16px 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.fig svg { max-width: 100%; height: auto; }
.fig img { max-width: 100%; height: auto; border-radius: 8px; }
.fig figcaption { font-size: 13px; color: var(--sub); margin-top: 8px; }
.fig .credit { display: block; font-size: 12px; }
a.wiki { font-weight: 600; }
.wiki-missing { color: var(--missing); border-bottom: 1px dashed var(--missing); }
.links-box { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px; }
.links-box h3 { margin: 6px 0 8px; font-size: 15px; }
.links-box ul { margin: 0; padding-left: 18px; }
footer.bot { max-width: 880px; margin: 0 auto; padding: 0 18px 40px; color: var(--sub); font-size: 13px; }
/* 대문 */
.hero h1 { font-size: 32px; margin: 8px 0 4px; }
.hero p { color: var(--sub); margin: 0 0 6px; }
.search { margin: 18px 0 6px; }
.search input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
#results { margin-top: 8px; }
#results .hit { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0; color: var(--ink); }
#results .hit .t { font-weight: 700; }
#results .hit .m { color: var(--sub); font-size: 13px; }
#results .hit .x { color: var(--sub); font-size: 13.5px; margin-top: 3px; }
.cat-sec { margin-top: 30px; }
.cat-sec > h2 { font-size: 22px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.sub-name { font-size: 14px; font-weight: 700; color: var(--sub); margin: 14px 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); display: block; }
.card:hover { border-color: var(--accent); text-decoration: none; }
.card .t { font-weight: 700; font-size: 16px; }
.card .e { color: var(--sub); font-size: 12.5px; }
.card .d { color: var(--sub); font-size: 13.5px; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.count { color: var(--sub); font-size: 13px; }
code { background: var(--chip); padding: 1px 5px; border-radius: 5px; font-size: 0.92em; }
</style></head>
<body>
<header class="top"><div class="in"><span class="brand">반도체 백과</span><span class="tag">지식창고 · 재편 프리뷰</span></div></header>
<main>
  <div class="hero"><h1>반도체 백과</h1><p>반도체 공정의 모든 것을 항목 단위로 쌓는 지식창고. 전체 2개 항목 (재편 진행 중 — 기존 강의노트는 <a href="../index.html">여기</a>).</p></div>
  <div class="search"><input id="q" type="search" placeholder="항목 검색 — 예: 엘립소미터, 식각, SiOCN" autocomplete="off"><div id="results"></div></div>
  <section class="cat-sec"><h2>계측·분석 <span class="count">1개 항목</span></h2>
    <div class="sub-name">두께·형상</div><div class="cards">
      <a class="card" href="e/ellipsometer.html"><div class="t">엘립소미터</div><div class="e">Spectroscopic Ellipsometry</div><div class="d"></div></a></div></section><section class="cat-sec"><h2>재료 <span class="count">1개 항목</span></h2>
    <div class="sub-name">기판·웨이퍼</div><div class="cards">
      <a class="card" href="e/silicon-wafer.html"><div class="t">실리콘 웨이퍼</div><div class="e">Silicon Wafer</div><div class="d"></div></a></div></section>
</main>
<footer class="bot">반도체 백과 · 2026년 10월 25일 기준 · 프리뷰 빌드</footer>
<script>
const q = document.getElementById('q'), box = document.getElementById('results');
let idx = null;
q.addEventListener('focus', async () => { if (!idx) idx = await (await fetch('search-index.json')).json(); }, { once: true });
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if (!v || !idx) { box.innerHTML = ''; return; }
  const hits = idx.filter(x => (x.t + ' ' + x.en + ' ' + x.tags.join(' ') + ' ' + x.x).toLowerCase().includes(v)).slice(0, 12);
  box.innerHTML = hits.map(x => '<a class="hit" href="e/' + x.slug + '.html"><span class="t">' + x.t + '</span> <span class="m">' + x.cat + ' &gt; ' + x.sub + '</span><div class="x">' + x.x.slice(0, 140) + '…</div></a>').join('') || '<p style="color:var(--sub)">결과 없음</p>';
});
</script>
</body></html>
