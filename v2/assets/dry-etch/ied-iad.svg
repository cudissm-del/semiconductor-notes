<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 744" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>이온 에너지 분포(IED)와 각도 분포(IAD)</title>
<desc>바이어스 주파수가 낮으면 쌍봉, 높으면 단봉이 되는 IED와, 압력에 따라 폭이 달라지는 IAD, 종횡비 한계 1/tanθ 모식도.</desc>
<text x="580" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">이온 에너지 분포(IED)와 각도 분포(IAD)</text>
<text x="580" y="60" text-anchor="middle" font-size="13" fill="#666">에너지·각도 축은 개념도용 상대 척도 — 모양과 갈리는 원리가 핵심이다</text>
<text x="40" y="98" font-size="16" font-weight="bold" fill="#222">(a) IED — 바이어스 주파수가 낮을 때</text>
<text x="40" y="382" font-size="12" fill="#444">이온 통과 시간 ≪ RF 주기 → 진입 위상마다 에너지가 갈린다</text>
