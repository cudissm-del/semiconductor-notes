<text x="290" y="404" text-anchor="middle" font-size="12.5" fill="#222">쌍봉 — 피크 사이 간격은 RF 시스 전압 진폭이 정한다. 한쪽 피크와 꼬리가 창을 벗어나면 선택비가 깎인다</text>
<text x="870" y="404" text-anchor="middle" font-size="12.5" fill="#222">단봉 — 분포 전체를 좁은 창 안에 넣을 수 있다 (동기 바이어스로 더 좁힌 극단이 단일에너지)</text>
<text x="40" y="448" font-size="16" font-weight="bold" fill="#222">(c) IAD — 각도 분포의 폭이 닿는 깊이를 정한다</text>
