<text x="722" y="470" font-size="13" fill="#7e2f2f">θ</text>
<text x="810" y="518" font-size="12.5" fill="#444">θ만큼 기울어진 이온은</text>
<text x="810" y="538" font-size="12.5" fill="#444">종횡비 ≈ 1/tanθ 를 넘는 깊이에</text>
<text x="810" y="558" font-size="12.5" fill="#444">벽을 맞지 않고는 닿지 못한다</text>
<text x="810" y="588" font-size="12.5" fill="#444">그 아래 바닥은 반사 이온과</text>
<text x="810" y="608" font-size="12.5" fill="#444">라디칼만으로 깎인다 → ARDE의 기원</text>
<text x="580" y="732" text-anchor="middle" font-size="11.5" fill="#666">근거: 분포가 갈리는 통과 시간 비, 전하교환 꼬리, 문턱 사이 창의 폭(약 10 eV)은 「건식 식각」 항목 본문(Economou 2013 서술)과 맞췄다.</text>
