<text x="540" y="680" text-anchor="end" font-size="12" fill="#444">수직에서 벗어난 각도 θ</text>
<text x="333.3" y="486" font-size="12.5" font-weight="bold" fill="#3c5a80">저압 — 충돌이 적어 좁다</text>
<text x="396.7" y="574" font-size="12.5" font-weight="bold" fill="#8a5d14">고압 — 충돌·전하교환으로 넓다</text>
<text x="40" y="700" font-size="12" fill="#444">각도 분포 폭 수 ° 수준이 곧 이온이 벽에 부딪히지 않고 닿는 깊이의 한계다.</text>
<text x="640" y="448" font-size="16" font-weight="bold" fill="#222">깊이의 기하학</text>
