<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>Planar · FinFET · GAA · CFET 구조 비교</title>
<desc>게이트가 채널을 감싸는 면의 수로 본 트랜지스터 세대 비교. 게이트는 반투명하게 그려 채널이 비치도록 했다.</desc>
<text x="580" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">트랜지스터 세대 비교 — 게이트는 채널을 몇 면으로 감싸나</text>
<text x="580" y="60" text-anchor="middle" font-size="13" fill="#666">호박색 반투명 = 게이트 · 파란색 = 채널(Si) · 연회색 = 기판/절연 · 치수는 개념도용</text>
