<text x="322" y="300" text-anchor="middle" font-size="26" fill="#59616e">→</text>
<text x="607" y="300" text-anchor="middle" font-size="26" fill="#59616e">→</text>
<text x="892" y="300" text-anchor="middle" font-size="26" fill="#59616e">→</text>
<text x="155" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Planar</text>
<text x="155" y="474" text-anchor="middle" font-size="12.5" fill="#666">~22 nm 이전</text>
<text x="155" y="498" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5d14">게이트 1면 (윗면)</text>
<text x="155" y="522" text-anchor="middle" font-size="12.5" fill="#444">게이트 길이가 줄면 드레인 전계가</text>
<text x="155" y="541" text-anchor="middle" font-size="12.5" fill="#444">채널 아래를 파고든다 (DIBL)</text>
<text x="440" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">FinFET</text>
<text x="440" y="474" text-anchor="middle" font-size="12.5" fill="#666">22 nm ~ 3 nm</text>
<text x="440" y="498" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5d14">게이트 3면 (양옆+윗면)</text>
<text x="440" y="522" text-anchor="middle" font-size="12.5" fill="#444">전류는 핀 개수 단위로만</text>
<text x="440" y="541" text-anchor="middle" font-size="12.5" fill="#444">늘릴 수 있다 (양자화)</text>
<text x="725" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">GAA 나노시트</text>
<text x="725" y="474" text-anchor="middle" font-size="12.5" fill="#666">3 · 2 nm</text>
<text x="725" y="498" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5d14">게이트 4면 (전면)</text>
<text x="725" y="522" text-anchor="middle" font-size="12.5" fill="#444">시트 폭을 연속 조절 —</text>
<text x="725" y="541" text-anchor="middle" font-size="12.5" fill="#444">고성능·저전력 셀을 섞는다</text>
<text x="1010" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CFET</text>
<text x="1010" y="474" text-anchor="middle" font-size="12.5" fill="#666">연구 단계</text>
<text x="1010" y="498" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5d14">게이트 4면 × 상하 적층</text>
<text x="1010" y="522" text-anchor="middle" font-size="12.5" fill="#444">nFET 위에 pFET을 쌓아</text>
<text x="1010" y="541" text-anchor="middle" font-size="12.5" fill="#444">셀 높이를 줄인다</text>
<text x="580" y="608" text-anchor="middle" font-size="12.5" fill="#444">세대가 갈수록 몸체에 게이트가 닿지 않는 영역이 사라진다 — FinFET의 핀 두께, GAA의 시트 두께가 정전기 제어(자연 길이)를 정한다</text>
<text x="580" y="632" text-anchor="middle" font-size="11.5" fill="#666">근거: 세대 전환과 업체별 시점은 「FinFET」·「GAA 나노시트」 항목 본문. CFET은 두 항목이 함께 적어 둔 다음 구조(Forksheet 다음 단계)로, 양산 세대가 아니다.</text>
</svg>