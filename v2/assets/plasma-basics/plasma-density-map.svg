<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 724" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>방전 방식별 압력–전자밀도 지도</title>
<desc>압력(가로, 로그)과 전자밀도(세로, 로그) 평면에서 CCP·ICP·ECR/헬리콘·원격·대기압 방전의 교재 전형 대역을 표시한 정성 지도.</desc>
<text x="580" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">방전 방식별 압력–전자밀도 지도</text>
<text x="580" y="60" text-anchor="middle" font-size="13" fill="#666">양축 로그 · 띠는 교재 전형 대역(정성 지도) — 특정 장비의 실측값이 아니다</text>
